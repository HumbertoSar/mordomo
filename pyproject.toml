[project]
name = "mordomo"
version = "0.1.0"
description = "Mordomo da Família — agente conversacional (Telegram → WhatsApp) para aprender Analytics, Observabilidade e Evals com LangGraph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0",
    "langgraph>=1.0",
    "langchain-openai>=1.0",           # OpenRouter usa API compatível com OpenAI
    "langgraph-checkpoint-postgres>=2.0",
    "aiogram>=3.15",
    "langfuse>=3.0",
    "apscheduler>=3.10,<4",
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary]>=3.2",            # driver único: app (SQLAlchemy) e checkpointer
    "pydantic-settings>=2.5",
    "dateparser>=1.2",
    "python-dotenv>=1.0",
    "tzdata",                          # ZoneInfo no Windows não tem base de fusos própria
    "alembic>=1.19.1",
    "httpx>=0.27",                     # transcrição de áudio (Groq); já vinha via langfuse
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "aiosqlite>=0.20",                 # só para testes (banco em memória)
]

# Canal WhatsApp (fase 3): `uv sync --extra whatsapp`.
# Extra, e não dependência fixa, para quem roda só Telegram não carregar um
# servidor HTTP. Sem pywa (ADR-009): o adapter fala com a Cloud API por httpx,
# que já é dependência — aqui só entra a borda HTTP do webhook.
[project.optional-dependencies]
whatsapp = ["fastapi>=0.115", "uvicorn>=0.32"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mordomo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
