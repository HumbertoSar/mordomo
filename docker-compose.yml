services:
  postgres:
    image: postgres:16-alpine
    container_name: mordomo-postgres
    environment:
      POSTGRES_USER: mordomo
      # Fallback "mordomo" é SÓ para dev local. Na VPS (compartilhada!) defina
      # POSTGRES_PASSWORD forte no .env: o bind em 127.0.0.1 barra a internet,
      # mas não outros processos/usuários da mesma máquina — e este banco
      # guarda o cofre da família em claro. Volume já inicializado NÃO troca de
      # senha por variável: ver "Senha do banco" no docs/deploy-vps.md.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mordomo}
      POSTGRES_DB: mordomo
    ports:
      # Só localhost: em dev o app roda fora do compose e conecta aqui; na VPS
      # isso evita expor o Postgres à internet (o bot fala pela rede interna).
      # POSTGRES_HOST_PORT existe porque VPS compartilhada pode já ter um
      # Postgres em 5432 (na do Humberto, o storyrender tem) — defina no .env.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - mordomo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mordomo"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Produção (VPS): `docker compose --profile bot up -d --build`.
  # Em dev o perfil fica de fora — o bot roda com `make run` na máquina,
  # e subir os dois com o MESMO token daria conflito 409 no long polling.
  bot:
    profiles: ["bot"]
    build: .
    container_name: mordomo-bot
    env_file: .env
    environment:
      # Dentro do compose o Postgres se chama "postgres", não localhost
      DATABASE_URL: postgresql+psycopg://mordomo:${POSTGRES_PASSWORD:-mordomo}@postgres:5432/mordomo
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mordomo_pgdata:

# Observabilidade: comece com o Langfuse Cloud (plano grátis) — só preencher
# as chaves no .env. Para self-host depois (v3 usa ClickHouse + Redis + S3),
# siga https://langfuse.com/self-hosting — não vale acoplar aqui no MVP.
