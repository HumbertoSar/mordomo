name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Testes (sem rede, sem chaves — SQLite via conftest)
        run: uv run pytest -q
      - name: Lint
        run: uv run ruff check src tests
      - name: Eval de datas pt-BR (informativo — não quebra o build)
        run: uv run python evals/run_evals.py
        continue-on-error: true
